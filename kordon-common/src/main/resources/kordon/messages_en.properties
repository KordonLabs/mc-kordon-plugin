# Kordon plugin texts in English (UTF-8), used for the console. Placeholders are {name}.
# Every key here also exists in messages_ru.properties, which is the fallback for a missing key.
# Panel section and setting names are quoted as the panel's English interface shows them.

# ── Console ──────────────────────────────────────────────────────────────────
log.start=Kordon {version} started on {platform} {serverVersion}. Kordon API: {apiUrl}, key {tokenPrefix}… ({keySource}).
log.not_configured=Kordon is not linked to a server: players join without checks. Run /kordon link <key> in the proxy console — the key is in the Kordon panel ({panelUrl}, server → "Plugin") — or download the ready Kordon.jar there, stop the proxy, replace this file with it and start the proxy.
log.connected=Kordon connected to server "{server}". Mode: {mode}. If Kordon is unavailable: {failOpen}.
log.settings_changed=Kordon settings updated: mode: {mode}, if Kordon is unavailable: {failOpen}.
mode.protect=protection
mode.monitor=monitoring only
failopen.true=let everyone in
failopen.false=let nobody in
log.blocked=Blocked {name} ({ip}): {reasons}.
log.would_block={name} ({ip}) would have been blocked: {reasons} (monitoring mode is on).
log.fail_open=Kordon did not answer ({cause}): {name} let in by the "If the check is unavailable" setting.
log.fail_closed=Kordon did not answer ({cause}): {name} not let in by the "If the check is unavailable" setting.
cause.timeout=no answer within 3 s
cause.network=no connection
cause.server_error=error on the Kordon side
cause.bad_request=the panel rejected the request
cause.unauthorized=key not accepted
cause.unsupported=unexpected answer from the panel
log.unauthorized=The Kordon panel does not accept this server's key {tokenPrefix}… (it was reissued or the server was deleted). Link the proxy again: run /kordon link <key> in the proxy console (the key is on {pluginPage}), or download the plugin there again, stop the proxy, replace Kordon.jar and start the proxy. Meanwhile players are {failOpenAction}, as set in the panel.
failopen.action.true=let in
failopen.action.false=not let in
log.account_disabled=The Kordon account that owns this server is disabled. All players join without checks.
log.legacy_panel=The Kordon panel is an older version: login checks and status work. Online players, kicks from the panel and /kordon commands will appear once it is updated.
log.feature_off=The Kordon panel does not support "{feature}": the feature is off until the next check.
log.sync_failing=Could not send player data to Kordon ({cause}); retrying in {sec} s.
log.queue_overflow=The Kordon event queue is full (the panel has been unavailable for a long time): old events were dropped, the online list will recover by itself.
log.update_available=A new Kordon version {latest} is available (you have {current}). Download it in the panel: {pluginPage}
log.duplicate_jars=The plugins folder has several Kordon files: {files}. Keep one, the latest downloaded from the panel.
log.remote_kick=Disconnected {name}: {why}.
kick.why.panel=by a command from the panel
kick.why.blacklist=on the blacklist
kick.why.game=added to the blacklist with /kordon
log.list_changed={actor}: {line}
log.not_inet=Could not determine the IP of player {name} (not a TCP connection): joined without a check.
log.bad_panel_url=There is no Kordon API at {apiUrl} (answer {status}). Download the plugin again in the Kordon panel ({panelUrl}); if that does not help, contact Kordon support.
log.panel_redirect=The Kordon API at {apiUrl} redirects requests to {location}. Kordon does not follow redirects, so the key never goes to another address. Download the plugin again in the Kordon panel ({panelUrl}); if that does not help, contact Kordon support.
log.panel_http=The Kordon API address {apiUrl} starts with http://: the key is sent unencrypted. Please report this to Kordon support.
log.login_overload=Too many login checks at once ({n}): {name} handled by the "If the check is unavailable" setting.
log.jar_replaced=Kordon.jar was replaced while the proxy was running. The new file takes effect after a proxy restart.
# debug only
log.late_verdict=Kordon's answer for {name} came after 3.5 s: the login was already handled by the "If the check is unavailable" setting.

log.start_failed=Kordon failed to start ({error}): the proxy works, but players join without checks. Please report this to Kordon support.
log.overridden=Kordon would not have let {name} ({ip}) in: {reasons}. The login was allowed by another plugin.
cause.rate_limited=the panel asks to wait
cause.redirect=the panel redirects requests
cause.too_large=request too large
feature.sync=online players and kicks from the panel
feature.lists=/kordon whitelist and blacklist commands
feature.lookup=/kordon lookup command
log.install_newer=Kordon.jar was prepared by a newer Kordon panel (format {v}): using the fields this version knows. If something does not work, download the plugin again in the panel.
log.login_rejected=The Kordon panel rejected the login check of {name}: {error}. Meanwhile such players are {failOpenAction} by the "If the check is unavailable" setting. Download the plugin again in the panel; if that does not help, contact Kordon support.
log.legacy_config=plugins/Kordon/config.yml is no longer used: Kordon takes all its settings from the panel. The file can be deleted.
log.key_saved=Saved the key {tokenPrefix}… built into Kordon.jar to plugins/Kordon/secret.key.
log.key_replaced=Kordon.jar is newer than plugins/Kordon/secret.key and carries another key: using its key {tokenPrefix}… and saving it to secret.key (instead of {oldPrefix}…).
log.key_kept=plugins/Kordon/secret.key holds the key {tokenPrefix}…, Kordon.jar another one ({jarPrefix}…): using secret.key, Kordon.jar is not newer than it (the key was set with /kordon link or by an earlier start).
log.key_invalid=plugins/Kordon/secret.key does not hold a valid Kordon key: it is ignored. Run /kordon link <key> in the proxy console to replace it.
log.key_save_failed=Could not save plugins/Kordon/secret.key ({error}): the key built into Kordon.jar is used until the proxy restarts.
log.panel_url_property=Kordon API address from -Dkordon.panelUrl: {apiUrl} (for testing; normally it comes from Kordon.jar).
log.panel_url_property_invalid=-Dkordon.panelUrl is not a valid address (http(s)://host[:port][/path]): ignored.
log.linked=Kordon linked to server "{server}" with the key {tokenPrefix}… ({actor}); the key is saved in plugins/Kordon/secret.key.
log.unlinked=Kordon unlinked ({actor}): plugins/Kordon/secret.key deleted, players join without checks until /kordon link <key>.
log.link_failed=/kordon link with the key {tokenPrefix}… ({actor}) failed: {why}. Nothing was changed.
log.connection_restored=Connection to the Kordon panel restored (was down for {min} min).
log.connection_restored_short=Connection to the Kordon panel restored (was down for less than a minute).
cause.account_disabled=the account is disabled
cause.save_failed=secret.key could not be saved
actor.console=console
key.source.file=file plugins/Kordon/secret.key
key.source.jar=built into Kordon.jar
key.source.link=linked with /kordon link

# Block reason labels. Every code the panel sends is listed in contract/reason-codes.json; an unknown code reads
# reason.other.
reason.vpn=VPN
reason.proxy=proxy
reason.resproxy=residential proxy
reason.tor=TOR
reason.hosting=hosting
reason.suspicious=suspicious address
reason.country=country
reason.blacklist=blacklist
reason.whitelist=whitelist
reason.check_failed=check unavailable
reason.private_ip=local address
reason.kordon_base=blocked by Kordon
reason.kordon_base.bot=blocked by Kordon (bots)
reason.kordon_base.fraud=blocked by Kordon (fraud)
reason.kordon_base.cheat=blocked by Kordon (cheats)
reason.kordon_base.abuse=blocked by Kordon (abuse)
reason.mobile=mobile connection
reason.nick=nickname
reason.nick.kordon=nickname (Kordon rule)
reason.version=version
reason.attack=bots
reason.attack.gibberish=odd nickname
reason.attack.digits=all-digit nickname
reason.attack.prefixcounter=numbered nickname like the attack bots’
reason.attack.nearduplicate=nickname similar to the attack bots’
reason.attack.sameshape=nickname patterned like the attack bots’
reason.attack.protocol=same client version as the attack bots
reason.attack.brandsame=same client as the attack bots
reason.attack.brandmissing=client did not identify itself
reason.repeat_bot=bots (repeated connections)
reason.maintenance=maintenance
reason.plan_limit=plan checks used up
reason.other=other reason
