# ── Chat (&-codes) ───────────────────────────────────────────────────────────
# The trailing space of cmd.prefix is written as \u0020: editors strip trailing blanks.
cmd.prefix=&6Kordon &8»\u0020
notify.blocked=&8[&6Kordon&8] &7Не пустили &f{name}&7: {reasons}
notify.summary=&8[&6Kordon&8] &7…и ещё {n} входов не пропущено за минуту
cmd.help.header=&6Kordon {version} &7— команды:
cmd.help.status=&f/kordon status &7— связь с панелью и настройки
cmd.help.reload=&f/kordon reload &7— получить настройки из панели сейчас
cmd.help.lookup=&f/kordon lookup <ник|UUID|IP> &7— что Kordon знает об игроке или адресе
cmd.help.whitelist=&f/kordon whitelist add|remove <ник|IP|диапазон> [срок] [заметка] &7— белый список: пускать без проверки на VPN и страну
cmd.help.blacklist=&f/kordon blacklist add|remove <ник|IP|диапазон> [срок] [заметка] &7— чёрный список: не пускать и отключить, если в игре
cmd.usage.list=&7Использование: /kordon {list} add <ник|IP|UUID|диапазон> [1h|1d|7d|30d|навсегда] [заметка] [--ip|--name]
cmd.usage.lookup=&7Использование: /kordon lookup <ник|UUID|IP>
cmd.no_permission=&cНедостаточно прав: нужно право {perm}.
cmd.pending=&7Kordon: запрос отправлен…
cmd.err.disabled=&eКоманды /kordon выключены в панели Kordon (раздел «Плагин»).
cmd.err.rate=&eСлишком часто — подождите {sec} с.
cmd.err.network=&cKordon не ответил — попробуйте ещё раз.
cmd.err.unsupported=&eНа вашей панели Kordon этой команды пока нет — обновите панель.
cmd.err.unauthorized=&cПанель не принимает ключ — привяжите прокси заново: /kordon link <ключ> (ключ — в панели Kordon, раздел «Плагин»).
cmd.err.account_disabled=&eСервис Kordon для этого аккаунта отключён.
cmd.err.not_configured=&cKordon не привязан к серверу — выполните в консоли прокси /kordon link <ключ> (ключ — в панели Kordon, раздел «Плагин»).
cmd.err.no_player_ip=&cИгрока {name} сейчас нет в игре — укажите IP-адрес.
cmd.err.ip_permission=&cПоиск по IP доступен только с правом kordon.command.lookup.ip.
cmd.note_truncated=&eЗаметка обрезана до 200 символов.
cmd.reload.done=&aНастройки запрошены у панели Kordon.
cmd.reload.jar_replaced=&eKordon.jar заменён — перезапустите прокси, чтобы включить новый файл.
cmd.list.already_removed=&6Kordon &8» &7Записи «{value}» в списке уже нет.
cmd.link=&b[Открыть в панели]
cmd.link.hover=Страница в панели Kordon
cmd.status.header=&6Kordon &f{version} &7· {platform} {serverVersion} · Java {java}
cmd.status.panel_ok=&7API Kordon: &f{apiUrl} &7— &aна связи &7(ответ {ago} назад)
cmd.status.panel_lost=&7API Kordon: &f{apiUrl} &7— &cнет связи &7(последний ответ {ago} назад)
cmd.status.server=&7Сервер: &f«{server}» &7· режим: &f{mode} &7· если Kordon недоступен: &f{failOpen}
cmd.status.token=&7Ключ: &f{tokenPrefix}… &7({source})
cmd.status.online=&7Онлайн: &f{online} &7· очередь событий: &f{queue} &7· онлайн-список: {sessions} &7· команды: {commands}
cmd.status.update=&eДоступна новая версия {latest} — скачайте её в панели.

cmd.status.panel_never=&7API Kordon: &f{apiUrl} &7— &cнет связи &7(ответа ещё не было)
cmd.status.not_configured=&7Kordon: &cне привязан к серверу &7— выполните в консоли прокси &f/kordon link <ключ>&7 (ключ — в панели {panelUrl}: сервер → «Плагин») или скачайте там готовый Kordon.jar.
cmd.status.server_unknown=&7Сервер: &fнастройки ещё не получены от панели
cmd.status.sessions_on=&aвключён
cmd.status.sessions_off=&eвыключен
cmd.status.commands_on=&aвключены
cmd.status.commands_off=&eвыключены
cmd.err.rejected=&cПанель Kordon отклонила запрос — возможно, плагин устарел: скачайте новую версию в панели Kordon.
cmd.link.console=&7Страница в панели: &f{url}
cmd.reload.failed=&cНе удалось запросить настройки у панели: {error}
cmd.err.local_player_ip=&cУ игрока {name} локальный адрес ({ip}): так прокси видит всех игроков, если не получает их настоящие IP. Добавьте игрока по нику.
cmd.help.link=&f/kordon link <ключ> &7— привязать прокси к серверу в панели (ключ — в панели: сервер → «Плагин»)
cmd.help.unlink=&f/kordon unlink &7— отвязать прокси: удалить plugins/Kordon/secret.key
cmd.usage.link=&7Использование: /kordon link <ключ> — ключ есть в панели Kordon (сервер → «Плагин»).
cmd.link_key.chat_warning=&eКлюч, отправленный в чате, могут записать плагины журнала чата и команд. Лучше выполняйте /kordon link в консоли прокси; если ключ мог попасть к чужим — выпустите в панели новый.
cmd.link_key.invalid=&cЭто не ключ Kordon: он начинается с kmc_. Скопируйте его в панели (сервер → «Плагин»).
cmd.link_key.checking=&7Проверяем ключ &f{tokenPrefix}… &7в API Kordon ({apiUrl})…
cmd.link_key.done=&aГотово: прокси привязан к серверу &f«{server}»&a, ключ {tokenPrefix}… сохранён в plugins/Kordon/secret.key.
cmd.link_key.same=&7Этот ключ уже используется — ничего не изменилось.
cmd.link_key.refused=&cПанель Kordon не приняла ключ {tokenPrefix}… — его перевыпустили, сервер удалён или ключ скопирован не полностью. Ключ не сохранён.
cmd.link_key.unreachable=&cAPI Kordon ({apiUrl}) недоступен ({cause}) — ключ не сохранён. Попробуйте ещё раз.
cmd.link_key.account_disabled=&cСервис Kordon для аккаунта этого сервера отключён — ключ не сохранён.
cmd.link_key.rate=&eПанель просит подождать {sec} с — ключ не сохранён, попробуйте позже.
cmd.link_key.save_failed=&cКлюч подходит, но сохранить plugins/Kordon/secret.key не удалось ({error}) — ничего не изменено. Проверьте права на папку plugins.
cmd.link_key.busy=&eПривязка уже выполняется — дождитесь ответа.
cmd.link_key.no_api=&cНеизвестен адрес API Kordon — скачайте готовый Kordon.jar в панели Kordon.
cmd.unlink.done=&aПрокси отвязан: plugins/Kordon/secret.key удалён. Игроки заходят без проверки, пока вы снова не выполните /kordon link <ключ>.
cmd.unlink.jar_key=&eВ Kordon.jar встроен ключ {tokenPrefix}… — после перезапуска прокси плагин снова подключится с ним. Чтобы этого не было, поставьте общий Kordon.jar без ключа.
cmd.unlink.none=&7Прокси и так не привязан.
cmd.unlink.failed=&cНе удалось удалить plugins/Kordon/secret.key ({error}) — ничего не изменено.

