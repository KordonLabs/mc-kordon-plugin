reason.private_ip=локальный адрес
reason.kordon_base=заблокирован Kordon
reason.kordon_base.bot=заблокирован Kordon (боты)
reason.kordon_base.fraud=заблокирован Kordon (мошенничество)
reason.kordon_base.cheat=заблокирован Kordon (читы)
reason.kordon_base.abuse=заблокирован Kordon (нарушения)
reason.mobile=мобильное подключение
reason.nick=ник
reason.nick.kordon=ник (правило Kordon)
