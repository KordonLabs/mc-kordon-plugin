# Kordon plugin texts in Russian (UTF-8). Placeholders are {name}.
# Console lines (log.*) are printed without colour codes; chat lines use &-codes.
# Every key here has a constant in com.kordonlabs.plugin.common.text.MessageKey.

# ── Console ──────────────────────────────────────────────────────────────────
log.start=Kordon {version} запущен на {platform} {serverVersion}. API Kordon: {apiUrl}, ключ {tokenPrefix}… ({keySource}).
log.not_configured=Kordon не привязан к серверу — игроки заходят без проверки. Выполните в консоли прокси /kordon link <ключ> — ключ есть в панели Kordon ({panelUrl}, сервер → «Плагин»), — или скачайте там готовый Kordon.jar: остановите прокси, замените им этот файл и запустите прокси.
log.connected=Kordon подключён к серверу «{server}». Режим: {mode}. Если Kordon недоступен — {failOpen}.
log.settings_changed=Настройки Kordon обновлены: режим — {mode}, если Kordon недоступен — {failOpen}.
mode.protect=защита
mode.monitor=только наблюдение
failopen.true=пускать всех
failopen.false=не пускать никого
log.blocked=Не пустили {name} ({ip}): {reasons}.
log.would_block={name} ({ip}) был бы заблокирован: {reasons} — включён режим наблюдения.
log.fail_open=Kordon не ответил ({cause}) — {name} пущен по настройке «Если проверка недоступна».
log.fail_closed=Kordon не ответил ({cause}) — {name} не пущен по настройке «Если проверка недоступна».
cause.timeout=нет ответа за 3 с
cause.network=нет связи
cause.server_error=ошибка на стороне Kordon
cause.bad_request=панель отклонила запрос
cause.unauthorized=ключ не принят
cause.unsupported=панель ответила не так, как ожидалось
log.unauthorized=Панель Kordon не принимает ключ этого сервера {tokenPrefix}… (его перевыпустили или сервер удалён). Привяжите прокси заново: выполните в консоли прокси /kordon link <ключ> (ключ — на странице {pluginPage}) или скачайте там плагин заново — остановите прокси, замените Kordon.jar и запустите прокси. Пока игроков {failOpenAction} — так настроено в панели.
failopen.action.true=пускаем
failopen.action.false=не пускаем
log.account_disabled=Аккаунт Kordon, которому принадлежит сервер, отключён. Пускаем всех игроков без проверки.
log.legacy_panel=Панель Kordon старой версии: работают проверка входов и статус. Онлайн, кик из панели и команды /kordon появятся после её обновления.
log.feature_off=Панель Kordon не поддерживает «{feature}» — функция выключена до следующей проверки.
log.sync_failing=Не удалось отправить данные об игроках в Kordon ({cause}); повтор через {sec} с.
log.queue_overflow=Очередь событий Kordon переполнена (панель долго недоступна) — старые события пропущены, список онлайн восстановится автоматически.
log.update_available=Доступна новая версия Kordon {latest} (у вас {current}). Скачайте её в панели: {pluginPage}
log.duplicate_jars=В папке plugins несколько файлов Kordon: {files}. Оставьте один — последний скачанный из панели.
log.remote_kick=Отключили {name}: {why}.
kick.why.panel=по команде из панели
kick.why.blacklist=в чёрном списке
kick.why.game=добавлен в чёрный список командой /kordon
log.list_changed={actor}: {line}
log.not_inet=Не удалось определить IP игрока {name} (подключение не по TCP) — вход без проверки.
log.bad_panel_url=По адресу {apiUrl} нет API Kordon (ответ {status}). Скачайте плагин заново в панели Kordon ({panelUrl}); если не поможет — сообщите в поддержку Kordon.
log.panel_redirect=API Kordon по адресу {apiUrl} перенаправляет запросы на {location} — Kordon не идёт по перенаправлениям, чтобы ключ не ушёл на чужой адрес. Скачайте плагин заново в панели Kordon ({panelUrl}); если не поможет — сообщите в поддержку Kordon.
log.panel_http=Адрес API Kordon {apiUrl} начинается с http:// — ключ передаётся без шифрования. Сообщите об этом в поддержку Kordon.
log.login_overload=Слишком много одновременных проверок входа ({n}) — {name} обработан по настройке «Если проверка недоступна».
log.jar_replaced=Файл Kordon.jar заменён, пока прокси работал. Новый файл заработает после перезапуска прокси.
# debug only
log.late_verdict=Ответ Kordon для {name} пришёл позже 3,5 с — вход уже обработан по настройке «Если проверка недоступна».

log.start_failed=Kordon не запустился ({error}) — прокси работает, но игроки заходят без проверки. Сообщите об этом в поддержку Kordon.
log.overridden=Kordon не пустил бы {name} ({ip}): {reasons} — вход разрешён другим плагином.
cause.rate_limited=панель просит подождать
cause.redirect=панель перенаправляет запросы
cause.too_large=слишком большой запрос
feature.sync=онлайн и кик из панели
feature.lists=команды /kordon whitelist и blacklist
feature.lookup=команда /kordon lookup
log.install_newer=Файл Kordon.jar подготовлен более новой панелью Kordon (формат {v}) — используются известные поля. Если что-то не работает, скачайте плагин в панели заново.
log.login_rejected=Панель Kordon отклонила проверку входа {name}: {error}. Пока таких игроков {failOpenAction} по настройке «Если проверка недоступна». Скачайте плагин в панели заново; если не поможет — сообщите в поддержку Kordon.
log.legacy_config=plugins/Kordon/config.yml больше не используется: все настройки Kordon — в панели. Файл можно удалить.
log.key_saved=Ключ {tokenPrefix}… из Kordon.jar сохранён в plugins/Kordon/secret.key.
log.key_replaced=Kordon.jar новее plugins/Kordon/secret.key, и в нём другой ключ: используется его ключ {tokenPrefix}…, он сохранён в secret.key (вместо {oldPrefix}…).
log.key_kept=В plugins/Kordon/secret.key ключ {tokenPrefix}…, в Kordon.jar — другой ({jarPrefix}…): используется secret.key — Kordon.jar не новее его (ключ задан командой /kordon link или прошлым запуском).
log.key_invalid=В plugins/Kordon/secret.key нет правильного ключа Kordon — файл не используется. Выполните в консоли прокси /kordon link <ключ>, чтобы заменить его.
log.key_save_failed=Не удалось сохранить plugins/Kordon/secret.key ({error}) — ключ из Kordon.jar используется до перезапуска прокси.
log.panel_url_property=Адрес API Kordon задан флагом -Dkordon.panelUrl: {apiUrl} (для проверки; обычно адрес берётся из Kordon.jar).
log.panel_url_property_invalid=-Dkordon.panelUrl — неверный адрес (нужен http(s)://хост[:порт][/путь]), флаг не используется.
log.linked=Kordon привязан к серверу «{server}» ключом {tokenPrefix}… ({actor}); ключ сохранён в plugins/Kordon/secret.key.
log.unlinked=Kordon отвязан ({actor}): plugins/Kordon/secret.key удалён, игроки заходят без проверки до /kordon link <ключ>.
log.link_failed=/kordon link с ключом {tokenPrefix}… ({actor}) не выполнен: {why}. Ничего не изменено.
log.connection_restored=Связь с панелью Kordon восстановлена (не было {min} мин).
log.connection_restored_short=Связь с панелью Kordon восстановлена (не было меньше минуты).
cause.account_disabled=аккаунт отключён
cause.save_failed=не удалось сохранить secret.key
actor.console=консоль
key.source.file=файл plugins/Kordon/secret.key
key.source.jar=встроен в Kordon.jar
key.source.link=привязан командой /kordon link

